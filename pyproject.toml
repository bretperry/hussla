# The Python pack's project file: the app profile's tools, strictness, and import contracts.
# In the app: nothing at runtime; `uv run` reads it for the dev tools, ruff/pyright/pytest/import-linter read their own tables.
# Used by: package.json `py:*` scripts, via stacks/python/run.py (pnpm check), stacks/python/check-edited.mjs, ci.yml (via `pnpm check`).
# Uses: uv (installs everything below into .venv from uv.lock), ruff, pyright, import-linter, pytest, hypothesis.
#
# Two profiles live in one repo (python.mdc). The app profile is this file: src/app + tests/, with
# the tools below. The tooling profile is scripts/lib/*.py: stdlib only, run by the system python3,
# no install. Ruff and pyright still lint both, but the tooling scripts must never import a
# package from the dependency group.

[project]
# Rename `app` to your package: the folder under src/, the import contracts below, and this name.
name = "app"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
# Lower bounds only; uv.lock pins the exact versions, so CI and your machine run the same tools.
dev = [
  "hypothesis>=6.100",
  "import-linter>=2.0",
  "pyright>=1.1.380",
  "pytest>=8.0",
  "ruff>=0.6",
]

[build-system]
# uv's own backend: the project installs editable, so `import app` works for every tool with no path hacks.
requires = ["uv_build>=0.8.17,<0.9"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
# `-p no:cacheprovider`: no .pytest_cache churn; `-ra`: say why anything was skipped.
addopts = ["-ra", "--strict-markers", "--strict-config", "-p", "no:cacheprovider"]
# Tests import their helpers as `tests.chaos...`, so the repo root is on the path.
pythonpath = ["."]

[tool.pyright]
include = ["src", "tests", "scripts", "stacks"]
# The self-test builds its broken trees at run time, so there is nothing deliberately wrong on disk to exclude.
pythonVersion = "3.11"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "DTZ", "T20", "SIM", "PT", "RET", "S",
  "TID", "PL", "RUF", "ASYNC", "PERF", "FURB", "ANN", "PIE", "TRY", "FBT", "INP",
]
ignore = [
  # File headers are one line per label (docs.mdc) and run long; ruff format wraps the code, not the prose.
  "E501",
  # Long messages in a raise are fine here; a custom exception per message is noise.
  "TRY003",
  # Positional booleans in a dataclass or a test's helper read fine; keep FBT for function signatures only.
  "FBT003",
]

[tool.ruff.lint.per-file-ignores]
# Tests assert, use magic numbers, and may wire adapters and I/O directly (testing.mdc).
"tests/**" = ["S101", "PLR2004", "PLR0913", "ANN401", "TID251", "FBT001", "FBT002"]
# Scripts and the pack's own tests print and run subprocesses; they are unittest-style on purpose
# (the tooling profile has no pytest), so PT009/PT027 don't apply.
# INP001: scripts and stacks are plain script dirs, not packages. In src/ and tests/ a folder with no
# __init__.py is invisible to import-linter, so a layer violation inside it would pass (INP001 catches it).
"scripts/**" = ["T201", "S101", "S603", "S607", "PLR2004", "TID251", "PT009", "PT027", "INP001"]
"stacks/**" = ["T201", "S101", "S603", "S607", "PLR2004", "TID251", "PT009", "PT027", "INP001"]
# Adapters are where I/O lives, so the domain's banned-API list doesn't apply to them.
"src/app/adapters/**" = ["TID251"]
"src/app/container.py" = ["TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# The domain is pure (python.mdc, docs/ports-and-adapters.md): no network, database, process,
# filesystem, clock, or dynamic-import access. Banned everywhere, then switched off above for the
# places that may do I/O, so a new module is pure until someone says otherwise. The fix is always
# "put it in an adapter behind a port". This list is a deny list, so it can miss a package;
# stacks/python/domain_purity.py is the allow list (stdlib minus I/O) that catches the rest.
"requests".msg = "I/O in the domain or a use-case: put it in an adapter behind a port (docs/ports-and-adapters.md)."
"httpx".msg = "I/O in the domain or a use-case: put it in an adapter behind a port (docs/ports-and-adapters.md)."
"aiohttp".msg = "I/O in the domain or a use-case: put it in an adapter behind a port (docs/ports-and-adapters.md)."
"sqlalchemy".msg = "A database in the domain or a use-case: put it in an adapter behind a port (docs/ports-and-adapters.md)."
"sqlite3".msg = "A database in the domain or a use-case: put it in an adapter behind a port (docs/ports-and-adapters.md)."
"socket".msg = "I/O in the domain or a use-case: put it in an adapter behind a port (docs/ports-and-adapters.md)."
"subprocess".msg = "A process in the domain or a use-case: put it in an adapter behind a port (docs/ports-and-adapters.md)."
"shutil".msg = "Filesystem I/O in the domain or a use-case: put it in an adapter behind a port (docs/ports-and-adapters.md)."
"urllib.request".msg = "I/O in the domain or a use-case: put it in an adapter behind a port (docs/ports-and-adapters.md)."
"os".msg = "The environment or filesystem in the domain or a use-case: put it in an adapter behind a port (docs/ports-and-adapters.md)."
"pathlib".msg = "Filesystem I/O (Path.read_text ...) in the domain or a use-case: put it in an adapter behind a port (docs/ports-and-adapters.md)."
"io".msg = "I/O in the domain or a use-case: put it in an adapter behind a port (docs/ports-and-adapters.md)."
"time".msg = "A clock or sleep in the domain or a use-case: take the Clock port, and asyncio for sleeping (python.mdc)."
"http".msg = "I/O in the domain or a use-case: put it in an adapter behind a port (docs/ports-and-adapters.md)."
"smtplib".msg = "I/O in the domain or a use-case: put it in an adapter behind a port (docs/ports-and-adapters.md)."
"ftplib".msg = "I/O in the domain or a use-case: put it in an adapter behind a port (docs/ports-and-adapters.md)."
"importlib".msg = "Dynamic imports hide a dependency from import-linter: import the module by name, or wire it in app/container.py."
"asyncio.open_connection".msg = "I/O in the domain or a use-case: put it in an adapter behind a port (docs/ports-and-adapters.md)."
"asyncio.create_subprocess_exec".msg = "A process in the domain or a use-case: put it in an adapter behind a port (docs/ports-and-adapters.md)."
"asyncio.create_subprocess_shell".msg = "A process in the domain or a use-case: put it in an adapter behind a port (docs/ports-and-adapters.md)."
"datetime.datetime.now".msg = "A clock read in the domain or a use-case: take the Clock port (python.mdc)."
"datetime.datetime.utcnow".msg = "A clock read in the domain or a use-case: take the Clock port (python.mdc)."
"datetime.date.today".msg = "A clock read in the domain or a use-case: take the Clock port (python.mdc)."

[tool.importlinter]
# The layers of docs/ports-and-adapters.md as ONE layers contract (python.mdc). Why one: a `layers`
# contract fails when a layer names a module that doesn't exist ("Missing layer ... does not
# exist"), while a `forbidden` contract with a misspelled module passes silently, which is the
# worst way for a boundary check to fail. stacks/python/boundaries_test.py proves both facts.
root_package = "app"
include_external_packages = false

[[tool.importlinter.contracts]]
name = "layers-point-inward: container > services | adapters > ports > domain > config"
type = "layers"
# Names are relative to the container, `app`. Higher layers may import lower ones, never the
# reverse: the domain imports only config; a port only the domain; and nothing but the container
# imports an adapter. `|` makes services and adapters siblings: a use-case never imports an
# adapter, an adapter never calls a use-case.
containers = ["app"]
layers = [
  "container",
  "services | adapters",
  "ports",
  "domain",
  "config",
]
# Every module directly under `app` must sit in a layer above, so a new top-level module
# (app/cli.py, app/utils.py) is a decision, not a hole the contract silently doesn't cover.
exhaustive = true
