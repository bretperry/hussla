# Publishes a Hussla version: the multi-arch image to GHCR and the plain binaries on its GitHub release.
# In the app: what makes `ghcr.io/bretperry/hussla:<version>` (docker-compose.yml) and the release downloads (docs/install/laptop.md) exist.
# Used by: release.yml (workflow_call, after each ship to main); a `v*` tag a person pushes; a PR that touches the Dockerfile (build only).
# Uses: Dockerfile, scripts/release-binaries.sh, docker/* actions, the built-in GITHUB_TOKEN (packages: write, contents: write).
#
# Normally release.yml calls this with the tag it just made (a GITHUB_TOKEN tag push starts no
# workflow). A person can still push a tag by hand (`git tag v1.0.0 && git push origin v1.0.0`).
# Nothing here runs on a schedule or on dev pushes. The first publish creates the GHCR package as
# private: a person makes it public once (Package settings → Change visibility), or a NAS pull asks for a login.
# The PR run is the only proof the Dockerfile still builds for arm64 before a tag needs it; it runs
# only when the Dockerfile, .dockerignore or this file change.
#
# Runners: both jobs run on the repo variable LINUX_RUNNER when it is set, else ubuntu-latest; a PR
# from a fork always runs hosted (ci.yml → Runners). A self-hosted machine needs Docker with buildx
# (runner user in the `docker` group) for Image, and git, gh and bash for Binaries; Go and Node
# come from their setup actions. No QEMU either way: the Dockerfile cross-compiles.

name: Publish

on:
  push:
    tags: ["v*"]
  pull_request:
    branches: [dev, main]
    paths: [Dockerfile, .dockerignore, .github/workflows/publish-image.yml]
  workflow_call:
    inputs:
      tag:
        description: The version tag to publish (vX.Y.Z); it and its release already exist.
        required: true
        type: string
      latest:
        description: Also move `latest` and the X.Y tag (false when publishing an older version late).
        required: false
        default: true
        type: boolean

# Keyed by the version, not github.ref: a call from release.yml runs with ref refs/heads/main.
# ref_name, so a hand-pushed tag (refs/tags/vX → vX) and a call for vX share one group.
concurrency:
  group: publish-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

# The version being published (empty on a PR). Under workflow_call, github.event_name is the
# caller's (`push` to main) and github.ref_name is `main`, so neither names the version.
env:
  TAG: ${{ inputs.tag || (github.event_name == 'push' && github.ref_name) || '' }}

jobs:
  image:
    name: Image
    runs-on: ${{ fromJSON((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.LINUX_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      # The tagged commit; on a PR, the PR's merge commit as before.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      # No QEMU: the Dockerfile cross-compiles on the runner's own platform.
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: env.TAG != ''
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # v1.2.3 → 1.2.3, 1.2, latest; a PR gets a throwaway tag it never pushes.
      # `value=` because a workflow_call runs on refs/heads/main, where semver finds no tag in the ref.
      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }},enable=${{ env.TAG != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }},enable=${{ env.TAG != '' && inputs.latest != false }}
            type=raw,value=latest,enable=${{ env.TAG != '' && inputs.latest != false }}
            type=ref,event=pr
      - name: Build (and push on a tag)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: release
          platforms: linux/amd64,linux/arm64
          push: ${{ env.TAG != '' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ env.TAG || github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  binaries:
    name: Binaries
    if: github.event_name != 'pull_request'
    runs-on: ${{ fromJSON((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.LINUX_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: ./.github/actions/setup-node-pnpm
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build every platform
        run: bash scripts/release-binaries.sh "$TAG"
      # Onto the release: release.yml made it already, as a draft it publishes after this job (gh
      # finds a draft by its tag); a hand-pushed tag has none yet, so this makes it.
      # --clobber so a re-run of this job replaces its own files. Binaries are unsigned (laptop.md).
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber release/*
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes release/*
          fi
