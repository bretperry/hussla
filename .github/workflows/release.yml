# Cuts a release on every push to main: next version tag, a draft GitHub release, the image and binaries, then publishes the release.
# In the app: what makes a new `ghcr.io/bretperry/hussla:<version>` and its downloads exist after a ship, with no one opening GitHub.
# Used by: GitHub Actions on a push to main (the dev → main ship merge, ship.mdc).
# Uses: git tags, gh (the built-in GITHUB_TOKEN), .github/workflows/publish-image.yml (workflow_call).
#
# Version: the newest vX.Y.Z tag, patch bumped. The ship PR's title opts into a bigger bump with
# `release:minor` or `release:major` as a word of its own (a merge commit's message carries the PR
# title on its third line); the convention is in .cursor/rules/ship.project.mdc. No tag yet → v0.1.0.
# A tag made with GITHUB_TOKEN starts no other workflow, so the tag trigger in publish-image.yml
# never fires for these: this calls it directly instead.
# The release is made as a draft and published (and marked Latest) only once the image and the
# binaries are up, so nobody sees a release whose downloads or image aren't there.
# Resumable: when main's head already carries a vX.Y.Z tag, a published release means done; a
# draft or missing release means an earlier run stopped part way, so this run publishes it.
# Only the newest version takes Latest and the `latest`/X.Y image tags, so resuming an older run
# after a newer ship never rolls them back. A new version is cut only from main's current head,
# so re-running an old, untagged run releases nothing rather than tagging old code as newest.
# Runners: the repo variable LINUX_RUNNER when it is set, else ubuntu-latest (ci.yml → Runners);
# a self-hosted machine needs git and gh. An offline machine holds the release until it is back,
# or until the variable is deleted and the run re-run.

name: Release

on:
  push:
    branches: [main]

# One release at a time, never cancelled mid-run: two quick ships tag in order, each from the tags
# before it. GitHub keeps one pending run per group, so a third ship while one runs and one waits
# replaces the waiting one; that is fine, because the newest run releases main's head, which holds
# the replaced ship's commits too (its notes list them).
concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  tag:
    name: Tag and release
    runs-on: ${{ fromJSON((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.LINUX_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      # Empty when main's head was already released; the publish job then skips.
      tag: ${{ steps.next.outputs.tag }}
      # "true" when tag is the newest vX.Y.Z: only then does it become Latest and `latest`.
      newest: ${{ steps.next.outputs.newest }}
    steps:
      # Full history and every tag, to find the newest version and what main's head carries.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Next version
        id: next
        env:
          # Through env, not inline `${{ }}`, so a PR title can't inject shell.
          MESSAGE: ${{ github.event.head_commit.message }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Stop on the first failure, an unset variable, or a failed pipe stage.
          set -euo pipefail
          # Only plain vX.Y.Z tags count; a prerelease like v1.0.0-rc1 is neither latest nor a skip.
          strict='^v([0-9]+)\.([0-9]+)\.([0-9]+)$'
          # Newest plain tag by version order, not by date.
          latest=""
          for t in $(git tag -l 'v*' --sort=-v:refname); do
            if [[ "$t" =~ $strict ]]; then latest="$t"; break; fi
          done
          # "true" / "false" for a release's draft flag; "missing" only on a real 404, any other gh
          # error stops the run (a rate limit must not read as "no release").
          state() {
            local out
            if out="$(gh release view "$1" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>&1)"; then
              echo "$out"
            elif [[ "$out" == *"release not found"* ]]; then
              echo missing
            else
              echo "::error::Couldn't read the release for $1: $out" >&2
              return 1
            fi
          }
          # Main's head already has a version: finished, or resume a run that stopped part way.
          for t in $(git tag --points-at HEAD 'v*'); do
            if [[ "$t" =~ $strict ]]; then
              # gh finds a draft by its tag too.
              draft="$(state "$t")"
              if [ "$draft" = "false" ]; then
                echo "HEAD is already $t, and its release is published; nothing to release."
                exit 0
              fi
              echo "::warning::HEAD is already $t but its release isn't published (draft: $draft); resuming the publish."
              echo "tag=$t" >> "$GITHUB_OUTPUT"
              echo "resume=true" >> "$GITHUB_OUTPUT"
              if [ "$t" = "$latest" ]; then echo "newest=true" >> "$GITHUB_OUTPUT"; else
                echo "::warning::$t is older than $latest: it is published without taking Latest or the latest image tags."
                echo "newest=false" >> "$GITHUB_OUTPUT"
              fi
              exit 0
            fi
          done
          # A new version only for main's current head: a re-run of an older push would otherwise
          # tag old code as the newest version.
          git fetch --quiet origin main
          if [ "$GITHUB_SHA" != "$(git rev-parse origin/main)" ]; then
            echo "::warning::$GITHUB_SHA is no longer main's head; the run for the newer head releases it. Nothing to release."
            exit 0
          fi
          # A newest version left unpublished is flagged, not skipped over silently: re-run its run.
          if [ -n "$latest" ] && [ "$(state "$latest")" != "false" ]; then
            echo "::warning::$latest's release isn't published; re-run the Release run for its commit to finish it."
          fi
          if [ -z "$latest" ]; then
            next="v0.1.0"
          else
            [[ "$latest" =~ $strict ]]
            major="${BASH_REMATCH[1]}"; minor="${BASH_REMATCH[2]}"; patch="${BASH_REMATCH[3]}"
            # The marker is read from the PR title only: the third line of a merge commit
            # ("Merge pull request #N from …", blank, title), else the first line (a squash merge).
            title="$(head -n 1 <<<"$MESSAGE")"
            if [[ "$title" == "Merge pull request #"* ]]; then
              title="$(sed -n 3p <<<"$MESSAGE")"
            fi
            # A word of its own, punctuation around it allowed: `(release:minor)` counts,
            # `prerelease:minor` and `release:minority` don't.
            word='(^|[^[:alnum:]_:-])'; end='([^[:alnum:]_:-]|$)'
            echo "Ship title: $title"
            if [[ "$title" =~ ${word}release:major${end} ]]; then
              next="v$((major + 1)).0.0"
            elif [[ "$title" =~ ${word}release:minor${end} ]]; then
              next="v${major}.$((minor + 1)).0"
            else
              next="v${major}.${minor}.$((patch + 1))"
            fi
          fi
          echo "Releasing $next (previous: ${latest:-none})."
          echo "tag=$next" >> "$GITHUB_OUTPUT"
          echo "newest=true" >> "$GITHUB_OUTPUT"
      # The tag first (through the API, on this exact commit), so the publish job can check it out:
      # a draft release alone makes no tag until it is published.
      - name: Create tag
        if: steps.next.outputs.tag != '' && steps.next.outputs.resume != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.next.outputs.tag }}
        run: gh api "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$TAG" -f "sha=$GITHUB_SHA" > /dev/null
      # A draft release (notes from merged PRs) for the binaries to attach to; a resumed run makes
      # it when the stopped one never got this far.
      - name: Create draft release
        if: steps.next.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.next.outputs.tag }}
        run: |
          set -euo pipefail
          # Only a real "not found" makes one; any other gh error stops here, not in a duplicate draft.
          if ! out="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" 2>&1 > /dev/null)"; then
            if [[ "$out" != *"release not found"* ]]; then
              echo "::error::Couldn't read the release for $TAG: $out"
              exit 1
            fi
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "$TAG" --generate-notes
          fi

  publish:
    name: Publish
    needs: [tag]
    if: needs.tag.outputs.tag != ''
    # The called workflow's jobs can hold no more than this.
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/publish-image.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
      latest: ${{ needs.tag.outputs.newest == 'true' }}

  # Only now does the release show: published, and marked Latest when it is the newest version.
  release:
    name: Publish release
    needs: [tag, publish]
    runs-on: ${{ fromJSON((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.LINUX_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.tag.outputs.tag }}
          NEWEST: ${{ needs.tag.outputs.newest }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false "--latest=$NEWEST"
