# Merge gate: cheap checks on every push to a PR, the heavy tier only when it can fail and the PR is ready.
# In the app: nothing at runtime; deploy is a separate workflow (add one per project).
# Used by: GitHub Actions on PRs into dev/main and pushes to dev; rulesets require the job names below.
# Uses: .github/actions/setup-node-pnpm; scripts/lib/ci-change-scope.mjs; package.json scripts; stacks/*/pack.json.
# Watch: job `name:` values are ruleset keys; rename a job and its ruleset together (branching.mdc).
#
# Required checks: "Checks" (always) and "Build" (skips when it can't fail, which still reports),
# plus each present pack's `requiredChecks` (bootstrap-repo.sh adds them; branch-protection.mdc).
# Change scope is not required. Never add `paths-ignore` on `on:`, and never put [skip ci] on a PR
# commit: a skipped *job* reports as passing, a workflow that never ran blocks the PR forever.
#
# Checks runs the harness's own steps (rules, plan tables, harness tests, generated-file drift),
# then one step for every present stack pack's checks, read from its pack.json; a removed pack
# takes its checks with it (docs/decisions/0002-stack-packs.md). That step runs only the packs whose
# own files changed (Change scope's `packs`); prose runs none, anything shared runs all.
#
# Checks is one job, not five, so the install is paid once. Every check step still runs even
# when an earlier one fails (`!cancelled()`), so one lint error can't hide a failing test: habit
# learned that when a single job stopped at lint and CI said nothing about the code for days.
#
# The heavy tier (Build, and e2e when a project adds it) skips while the PR is a draft and when
# Change scope says no path that can break it changed. PRs into main and manual runs always run it.
#
# Runners: Checks and Build run on the repo variable LINUX_RUNNER when it is set (a JSON label
# list, e.g. ["self-hosted","Linux","thinkpad"]), else ubuntu-latest. Change scope stays hosted: it
# gates everything, so an offline machine must not stall it. Rollback when the machine is offline
# and required checks stall: delete the variable; no commit needed. Machine prerequisites and the
# one-instance rule for machine-wide resources: branch-protection.mdc → Self-hosted runners.

name: CI

on:
  pull_request:
    # ready_for_review so flipping a draft to ready runs the heavy tier it skipped while draft.
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [dev, main]
  # dev only: main's tip is always a tree already tested on the dev → main PR (pre-push guard +
  # guard-main-source.yml), so a push-to-main run is a guaranteed duplicate.
  push:
    branches: [dev]
  workflow_dispatch:

# One run per PR (or branch); a new push cancels the run it replaces.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scope:
    name: Change scope
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      heavy: ${{ steps.classify.outputs.heavy }}
      # all, none, or the pack names whose checks this change needs (Checks → Stack pack checks).
      packs: ${{ steps.classify.outputs.packs }}
    steps:
      # Full history so the three-dot PR diff can find the merge base.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Classify changed paths
        id: classify
        run: node scripts/lib/ci-change-scope.mjs
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}

  # Waits on Change scope for `packs`. `!cancelled()` so a failed scope job still runs Checks: `packs`
  # is then empty, which every pack reads as "run" (fail closed), and a skipped Checks would pass.
  checks:
    name: Checks
    needs: [scope]
    if: ${{ !cancelled() }}
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER || '"ubuntu-latest"') }}
    # Every pack's checks in one job: about 10 minutes on dev before the Android app, and a cold
    # Gradle cache (a PR can't write it) adds AGP, lint, and the SDK platform. The ceiling stops a
    # hung step, not a normal run.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Setup
        id: setup
        uses: ./.github/actions/setup-node-pnpm
      # [stack:go]
      # Go pack toolchain: Go from go.mod (its `go` line), and golangci-lint at the version go.mdc
      # names; keep the two in step. install-only: the pack's own checks run it, below.
      - name: Setup Go
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install golangci-lint
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        # Third-party action, pinned by commit (v9.3.0's tag points here).
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.5.0
          install-only: true
      # [/stack:go]
      # [stack:infra]
      # Pinned terraform, tflint, hadolint (sha256-checked); without them the infra checks fail in CI rather than skip.
      - name: Infra tools
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bash stacks/infra/install-tools.sh
      # [/stack:infra]
      # [harness]
      # The harness's own steps; `pnpm harness:eject` strips this fence (scripts/harness-eject.mjs).
      # .claude/rules/*.md must match the .cursor/rules/*.mdc they're generated from.
      - name: Claude rules in sync
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm rules:check
      # Every docs/plans table must parse (plans.mdc); the plan board reads nothing else.
      - name: Plan tables
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm plans:check
      # The harness's own tests run on node:test, so they need no stack pack.
      - name: Harness tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm test:harness
      # [/harness]
      # After an eject: the kept tests (packs' own, scripts/lib's). No such script before one, so a no-op.
      - name: Tool tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm run --if-present test:tools
      # Each pack's declared generated files must match what its generator writes (pack.json `generated`).
      - name: Generated files in sync
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm stack:drift
      # Every present pack's checks (stacks/*/pack.json `checks`), the same list `pnpm check` runs, so
      # CI and local can't disagree. Each runs even after one fails, folded into its own log group.
      # A pack's toolchain setup (a Rust toolchain, a simulator) goes above this in a [stack:<name>]
      # fence just after Setup, before any step that runs the pack's tools (the harness tests do:
# a pack's own harness tests may spawn its tools); the TypeScript pack needs none beyond Setup.
      # Only the packs Change scope names (`packs`): a skill or rule edit runs none, a Rust change runs
      # Rust. Toolchains above and Harness tests still run for every pack, so this skips checks, not setup.
      - name: Stack pack checks
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        env:
          PACKS: ${{ needs.scope.outputs.packs }}
        run: node scripts/stack.mjs check --packs "$PACKS"

  build:
    name: Build
    needs: [scope]
    # `!cancelled()` so a failed scope job still runs Build (fail closed): `heavy` is then empty,
    # and empty != 'false'. `.draft` is null on push/dispatch, and `!null` is true.
    if: ${{ !cancelled() && !github.event.pull_request.draft && (github.event_name == 'workflow_dispatch' || github.base_ref == 'main' || needs.scope.outputs.heavy != 'false') }}
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-pnpm
      # No-op until the project adds a `build` script. Add e2e as its own job with this job's `if:`.
      - name: Production build
        run: pnpm run --if-present build
