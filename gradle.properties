# Gradle switches for the Kotlin pack's build: cache what can be cached, so a warm run is seconds.
# In the app: every ./gradlew run (pnpm kotlin:check, the edit hook, CI) reads it.
# Used by: gradlew.

# Reuse the configured task graph when no build file changed (also catches build logic that
# reads state it shouldn't at execution time).
org.gradle.configuration-cache=true
# Reuse task outputs across runs and worktrees (~/.gradle/caches).
# A cached passing test result can outlive a gate that was off (docs/deferred.md → Kotlin pack: what the gates don't stop).
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
kotlin.code.style=official
