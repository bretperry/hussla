# The Kotlin pack's dependency and plugin versions, in one place (a Gradle version catalog).
# In the app: every build.gradle.kts reads these as `libs.*`; bump a version here, never in a build file.
# Used by: settings.gradle.kts, build.gradle.kts, domain/ usecases/ data/ app/ build.gradle.kts.
#
# detekt is on its 2.0 line (alpha) because 1.23 is built on Kotlin 2.0 and can't read newer syntax;
# keep `kotlin` equal to the Kotlin version detekt is built on (its pom), so the two never disagree.

[versions]
kotlin = "2.4.10"
coroutines = "1.11.0"
junit = "6.1.3"
kotest = "6.2.5"
detekt = "2.0.0-alpha.6"
ktfmt-plugin = "0.27.0"
# The Android Gradle Plugin. Its built-in Kotlin compiles :app with the `kotlin` version above.
agp = "9.4.1"
# The app's SDK levels: compile and target the newest platform, run on Android 8.0 and up.
android-compileSdk = "37"
android-targetSdk = "37"
android-minSdk = "26"
androidx-test = "1.7.0"
androidx-test-ext-junit = "1.3.0"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
kotest-property = { module = "io.kotest:kotest-property", version.ref = "kotest" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidx-test" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-ext-junit" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
detekt = { id = "dev.detekt", version.ref = "detekt" }
ktfmt = { id = "com.ncorti.ktfmt.gradle", version.ref = "ktfmt-plugin" }
android-application = { id = "com.android.application", version.ref = "agp" }
