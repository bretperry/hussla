[package]
name = "adapters"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

[features]
# The models in `chaos` (fault server, outbox, clock). Off by default so no production build carries
# test fakes. This crate's own tests switch it on through the self dev-dependency below, so plain
# `cargo test` runs them with no flags (a `required-features` test is skipped without a word).
test-support = ["dep:tokio"]

[dependencies]
domain.workspace = true
app.workspace = true
tokio = { workspace = true, features = ["rt", "time"], optional = true }

[dev-dependencies]
proptest.workspace = true
# Itself, with the feature on: test builds see `chaos`, a normal build never does. (boundaries.mjs lets a crate dev-depend on itself.)
adapters = { path = ".", features = ["test-support"] }
# Virtual time (`start_paused`) and a current-thread runtime for the fault-injection tests.
tokio = { workspace = true, features = ["macros", "rt", "test-util", "time"] }

[lints]
workspace = true
